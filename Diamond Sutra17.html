<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金剛經 第十七品 究竟無我分</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif TC', serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #2c1a0e;
  }
  .header {
    text-align: center;
    padding: 30px 20px 20px;
    border-bottom: 2px solid rgba(140,100,50,0.3);
    background: rgba(255,250,240,0.9);
  }
  .header h1 { font-size: 1.5em; color: #6b3d1e; letter-spacing: 0.3em; margin-bottom: 6px; }
  .header p { font-size: 0.8em; color: #9a7a5a; letter-spacing: 0.15em; }
  .nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px;
    background: rgba(255,248,235,0.9);
    border-bottom: 1px solid rgba(140,100,50,0.15);
    flex-wrap: wrap;
  }
  .nav a {
    font-size: 0.8em;
    color: #9a7a5a;
    text-decoration: none;
    letter-spacing: 0.1em;
    padding: 4px 14px;
    border: 1px solid rgba(140,100,50,0.3);
    border-radius: 20px;
    transition: all 0.2s;
  }
  .nav a:hover { background: rgba(180,140,60,0.15); color: #6b3d1e; }
  .nav a.current { background: rgba(180,140,60,0.2); color: #6b3d1e; font-weight: bold; pointer-events: none; }
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 1000px;
    margin: 0 auto;
    min-height: calc(100vh - 160px);
  }
  .left-panel { padding: 30px 25px; border-right: 1px solid rgba(140,100,50,0.25); }
  .right-panel { padding: 30px 25px; background: rgba(255,252,245,0.5); }
  .panel-title {
    font-size: 0.75em; letter-spacing: 0.3em; color: #9a7a5a;
    margin-bottom: 20px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(140,100,50,0.2);
  }
  .sentence {
    display: inline; cursor: pointer; line-height: 2.4;
    font-size: 1em; letter-spacing: 0.05em;
    transition: background 0.2s; border-radius: 3px; padding: 1px 2px;
  }
  .sentence:hover { background: rgba(180,140,60,0.15); }
  .sentence.active { background: rgba(180,140,60,0.28); color: #6b3d1e; font-weight: 700; }
  .translation-box { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .original-ref {
    font-size: 0.75em; color: #9a7a5a; margin-bottom: 12px;
    letter-spacing: 0.08em; padding: 6px 10px;
    background: rgba(180,140,60,0.1);
    border-left: 3px solid #c8a050; border-radius: 0 4px 4px 0;
  }
  .translation-text { font-size: 0.95em; line-height: 2.2; color: #3d2410; letter-spacing: 0.05em; }
  .hint { color: #b8956a; font-size: 0.85em; line-height: 2.2; letter-spacing: 0.08em; font-style: italic; }
  .divider { text-align: center; color: rgba(140,100,50,0.4); margin: 12px 0; letter-spacing: 0.5em; }
  .counter {
    text-align: center;
    padding: 12px;
    background: rgba(255,248,235,0.9);
    border-top: 1px solid rgba(140,100,50,0.15);
    font-size: 0.8em;
    color: #9a7a5a;
    letter-spacing: 0.15em;
  }
  .counter span { color: #6b3d1e; font-weight: bold; font-size: 1.1em; }
  @media (max-width: 600px) {
    .main { grid-template-columns: 1fr; }
    .left-panel { border-right: none; border-bottom: 1px solid rgba(140,100,50,0.25); }
    .nav { gap: 10px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>金剛般若波羅蜜經</h1>
  <p>第十七品　究竟無我分　｜　點擊原文句子，右側顯示白話翻譯</p>
</div>
<div class="nav">
  <a href="Diamond Sutra16.html">← 第十六品</a>
  <a class="current" href="#">第十七品（目前）</a>
  <a href="Diamond Sutra18.html">第十八品 →</a>
</div>
<div class="main">
  <div class="left-panel">
    <div class="panel-title">原　文（鳩摩羅什譯）</div>
    <div id="originalText"></div>
  </div>
  <div class="right-panel">
    <div class="panel-title">白話翻譯</div>
    <div id="translationArea">
      <p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>
    </div>
  </div>
</div>
<div class="counter">本頁瀏覽次數 <span id="visitCount">…</span> 次</div>

<script>
const verses = [
  { original: "爾時，須菩提白佛言：「世尊！善男子、善女人，發阿耨多羅三藐三菩提心，云何應住？云何降伏其心？」", translation: "那時候，須菩提對佛說：「世尊！善男子、善女人，發起了無上正等正覺之心，應當如何安住這個心？應當如何降伏這個心？」" },
  { original: "佛告須菩提：「善男子、善女人，發阿耨多羅三藐三菩提心者，當生如是心：", translation: "佛告訴須菩提：「善男子、善女人，凡是發起無上正等正覺之心的人，應當生起這樣的心：" },
  { original: "我應滅度一切眾生，滅度一切眾生已，而無有一眾生實滅度者。", translation: "我應當度化一切眾生，讓他們都脫離苦海得到解脫；但度化了一切眾生之後，卻沒有任何一個眾生是真正被我所度化的。" },
  { original: "何以故？須菩提！若菩薩有我相、人相、眾生相、壽者相，則非菩薩。", translation: "為什麼呢？須菩提！如果菩薩還有我相、人相、眾生相、壽者相這四種執著，那就不是真正的菩薩了。" },
  { original: "所以者何？須菩提！實無有法，發阿耨多羅三藐三菩提心者。", translation: "原因是什麼呢？須菩提！實際上並沒有一個固定的法，可以稱為「發無上正等正覺之心」。" },
  { original: "須菩提！於意云何？如來於然燈佛所，有法得阿耨多羅三藐三菩提不？」", translation: "須菩提！你認為如何？如來在然燈佛那裡，有沒有得到某種法，從而證得無上正等正覺呢？」" },
  { original: "「不也，世尊！如我解佛所說義，佛於然燈佛所，無有法得阿耨多羅三藐三菩提。」", translation: "「沒有，世尊！依我對佛所說義理的理解，佛在然燈佛那裡，並沒有得到任何特定的法而證得無上正等正覺。」" },
  { original: "佛言：「如是！如是！須菩提！實無有法，如來得阿耨多羅三藐三菩提。", translation: "佛說：「正是！正是！須菩提！確實沒有任何固定的法，是如來用來證得無上正等正覺的。" },
  { original: "須菩提！若有法如來得阿耨多羅三藐三菩提者，然燈佛則不與我授記：汝於來世，當得作佛，號釋迦牟尼。", translation: "須菩提！如果有某種固定的法是如來用來證得無上正等正覺的，那麼然燈佛就不會為我授記說：你在未來世，將成為佛，佛號釋迦牟尼。" },
  { original: "以實無有法得阿耨多羅三藐三菩提，是故然燈佛與我授記，作是言：汝於來世，當得作佛，號釋迦牟尼。", translation: "正因為實際上並沒有固定的法可以用來證得無上正等正覺，所以然燈佛才為我授記，說：你在未來世，將成為佛，佛號釋迦牟尼。" },
  { original: "何以故？如來者，即諸法如義。", translation: "為什麼呢？所謂「如來」，就是諸法本來如是、如實而來的意思。" },
  { original: "若有人言：如來得阿耨多羅三藐三菩提，須菩提！實無有法，佛得阿耨多羅三藐三菩提。", translation: "如果有人說：如來得到了無上正等正覺，須菩提！實際上並沒有任何固定的法，是佛所得到的無上正等正覺。" },
  { original: "須菩提！如來所得阿耨多羅三藐三菩提，於是中無實無虛。", translation: "須菩提！如來所證得的無上正等正覺，在這其中既不是真實固定的，也不是虛假空洞的。" },
  { original: "是故如來說：一切法皆是佛法。", translation: "所以如來說：一切法都是佛法。" },
  { original: "須菩提！所言一切法者，即非一切法，是故名一切法。", translation: "須菩提！所說的一切法，其實並非固定的一切法，所以才稱為一切法。" },
  { original: "須菩提！譬如人身長大。」", translation: "須菩提！就好比一個人的身體高大。」" },
  { original: "須菩提言：「世尊！如來說人身長大，則為非大身，是名大身。」", translation: "須菩提說：「世尊！如來說人身高大，其實並非真實固定的大身，只是名為大身。」" },
  { original: "「須菩提！菩薩亦如是。若作是言：我當滅度無量眾生，則不名菩薩。", translation: "「須菩提！菩薩也是這樣。如果菩薩說：我將要度化無量的眾生，那就不能稱為菩薩了。" },
  { original: "何以故？須菩提！實無有法名為菩薩。", translation: "為什麼呢？須菩提！實際上並沒有一個固定的法可以稱為菩薩。" },
  { original: "是故佛說：一切法無我、無人、無眾生、無壽者。", translation: "所以佛說：一切法都是無我、無人、無眾生、無壽者的。" },
  { original: "須菩提！若菩薩作是言：我當莊嚴佛土，是不名菩薩。", translation: "須菩提！如果菩薩說：我將要莊嚴佛國淨土，這樣的人就不能稱為菩薩了。" },
  { original: "何以故？如來說莊嚴佛土者，即非莊嚴，是名莊嚴。", translation: "為什麼呢？如來說莊嚴佛土，其實並非固定的莊嚴，只是名為莊嚴。" },
  { original: "須菩提！若菩薩通達無我法者，如來說名真是菩薩。」", translation: "須菩提！如果菩薩真正通達了無我之法，如來說這樣的人才是真正的菩薩。」" }
];

// ===== 計數器 =====
const KEY = 'visits_sutra17';
let count = parseInt(localStorage.getItem(KEY) || '0') + 1;
localStorage.setItem(KEY, count);
document.getElementById('visitCount').textContent = count;

// ===== 渲染原文 =====
function renderOriginal() {
  const container = document.getElementById('originalText');
  verses.forEach((v, i) => {
    const span = document.createElement('span');
    span.className = 'sentence';
    span.textContent = v.original;
    span.addEventListener('click', () => selectVerse(i));
    container.appendChild(span);
  });
}

function selectVerse(index) {
  document.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sentence')[index].classList.add('active');
  document.getElementById('translationArea').innerHTML = `
    <div class="translation-box">
      <div class="original-ref">原文：${verses[index].original}</div>
      <div class="divider">✦</div>
      <div class="translation-text">${verses[index].translation}</div>
    </div>
  `;
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('sentence') && !e.target.closest('#translationArea')) {
    document.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
    document.getElementById('translationArea').innerHTML =
      '<p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>';
  }
});

renderOriginal();
</script>
</body>
</html>
