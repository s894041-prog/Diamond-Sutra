<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>金剛經 第三十品 一合理相分</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Serif TC',serif;background:#f5f0e8;min-height:100vh;color:#2c1a0e}.header{text-align:center;padding:30px 20px 20px;border-bottom:2px solid rgba(140,100,50,0.3);background:rgba(255,250,240,0.9)}.header h1{font-size:1.5em;color:#6b3d1e;letter-spacing:.3em;margin-bottom:6px}.header p{font-size:.8em;color:#9a7a5a;letter-spacing:.15em}.nav{display:flex;justify-content:center;gap:20px;padding:12px;background:rgba(255,248,235,0.9);border-bottom:1px solid rgba(140,100,50,0.15);flex-wrap:wrap}.nav a{font-size:.8em;color:#9a7a5a;text-decoration:none;letter-spacing:.1em;padding:4px 14px;border:1px solid rgba(140,100,50,0.3);border-radius:20px;transition:all .2s}.nav a:hover{background:rgba(180,140,60,0.15);color:#6b3d1e}.nav a.current{background:rgba(180,140,60,0.2);color:#6b3d1e;font-weight:bold;pointer-events:none}.main{display:grid;grid-template-columns:1fr 1fr;max-width:1000px;margin:0 auto;min-height:calc(100vh - 160px)}.left-panel{padding:30px 25px;border-right:1px solid rgba(140,100,50,0.25)}.right-panel{padding:30px 25px;background:rgba(255,252,245,0.5)}.panel-title{font-size:.75em;letter-spacing:.3em;color:#9a7a5a;margin-bottom:20px;padding-bottom:8px;border-bottom:1px solid rgba(140,100,50,0.2)}.sentence{display:inline;cursor:pointer;line-height:2.4;font-size:1em;letter-spacing:.05em;transition:background .2s;border-radius:3px;padding:1px 2px}.sentence:hover{background:rgba(180,140,60,0.15)}.sentence.active{background:rgba(180,140,60,0.28);color:#6b3d1e;font-weight:700}.translation-box{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.original-ref{font-size:.75em;color:#9a7a5a;margin-bottom:12px;letter-spacing:.08em;padding:6px 10px;background:rgba(180,140,60,0.1);border-left:3px solid #c8a050;border-radius:0 4px 4px 0}.translation-text{font-size:.95em;line-height:2.2;color:#3d2410;letter-spacing:.05em}.hint{color:#b8956a;font-size:.85em;line-height:2.2;letter-spacing:.08em;font-style:italic}.divider{text-align:center;color:rgba(140,100,50,0.4);margin:12px 0;letter-spacing:.5em}.counter{text-align:center;padding:12px;background:rgba(255,248,235,0.9);border-top:1px solid rgba(140,100,50,0.15);font-size:.8em;color:#9a7a5a;letter-spacing:.15em}.counter span{color:#6b3d1e;font-weight:bold;font-size:1.1em}@media(max-width:600px){.main{grid-template-columns:1fr}.left-panel{border-right:none;border-bottom:1px solid rgba(140,100,50,0.25)}.nav{gap:10px}}</style></head>
<body>
<div class="header"><h1>金剛般若波羅蜜經</h1><p>第三十品　一合理相分　｜　點擊原文句子，右側顯示白話翻譯</p></div>
<div class="nav"><a href="Diamond Sutra29.html">← 第二十九品</a><a class="current" href="#">第三十品（目前）</a><a href="Diamond Sutra31.html">第三十一品 →</a></div>
<div class="main">
<div class="left-panel"><div class="panel-title">原　文（鳩摩羅什譯）</div><div id="originalText"></div></div>
<div class="right-panel"><div class="panel-title">白話翻譯</div><div id="translationArea"><p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p></div></div>
</div>
<div class="counter">本頁瀏覽次數 <span id="visitCount">…</span> 次</div>
<script>
const verses=[
{original:"「須菩提！若善男子、善女人，以三千大千世界碎為微塵，於意云何？是微塵眾，寧為多不？」",translation:"「須菩提！如果善男子、善女人把三千大千世界碎成微塵，你認為如何？這些微塵多不多？」"},
{original:"「甚多，世尊！何以故？若是微塵眾實有者，佛則不說是微塵眾。所以者何？佛說微塵眾，即非微塵眾，是名微塵眾。",translation:"「非常多，世尊！為什麼呢？如果這些微塵是真實固定存在的，佛就不會說這是微塵眾了。原因是什麼呢？佛說微塵眾，其實並非真實固定的微塵眾，只是名為微塵眾。"},
{original:"世尊！如來所說三千大千世界，即非世界，是名世界。",translation:"世尊！如來所說的三千大千世界，其實並非真實固定的世界，只是名為世界。"},
{original:"何以故？若世界實有者，則是一合相。如來說一合相，即非一合相，是名一合相。」",translation:"為什麼呢？如果世界是真實固定存在的，那它就是一個聚合的整體之相。如來說一合相，其實並非真實固定的一合相，只是名為一合相。」"},
{original:"「須菩提！一合相者，則是不可說，但凡夫之人，貪著其事。」",translation:"「須菩提！所謂一合相，是不可以用語言說明的，但凡夫俗子卻貪著於此事。」"}
];
const KEY='visits_sutra30';let count=parseInt(localStorage.getItem(KEY)||'0')+1;localStorage.setItem(KEY,count);document.getElementById('visitCount').textContent=count;
function renderOriginal(){const c=document.getElementById('originalText');verses.forEach((v,i)=>{const s=document.createElement('span');s.className='sentence';s.textContent=v.original;s.addEventListener('click',()=>selectVerse(i));c.appendChild(s);})}
function selectVerse(i){document.querySelectorAll('.sentence').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.sentence')[i].classList.add('active');document.getElementById('translationArea').innerHTML='<div class="translation-box"><div class="original-ref">原文：'+verses[i].original+'</div><div class="divider">✦</div><div class="translation-text">'+verses[i].translation+'</div></div>';}
document.addEventListener('click',e=>{if(!e.target.classList.contains('sentence')&&!e.target.closest('#translationArea')){document.querySelectorAll('.sentence').forEach(s=>s.classList.remove('active'));document.getElementById('translationArea').innerHTML='<p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>';}});
renderOriginal();
</script></body></html>
