<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Serif TC', serif; background: #f5f0e8; min-height: 100vh; color: #2c1a0e; }
  .header { text-align: center; padding: 30px 20px 20px; border-bottom: 2px solid rgba(140,100,50,0.3); background: rgba(255,250,240,0.9); }
  .header h1 { font-size: 1.5em; color: #6b3d1e; letter-spacing: 0.3em; margin-bottom: 6px; }
  .header p { font-size: 0.8em; color: #9a7a5a; letter-spacing: 0.15em; }
  .nav { display: flex; justify-content: center; gap: 20px; padding: 12px; background: rgba(255,248,235,0.9); border-bottom: 1px solid rgba(140,100,50,0.15); }
  .nav a { font-size: 0.8em; color: #9a7a5a; text-decoration: none; letter-spacing: 0.1em; padding: 4px 12px; border: 1px solid rgba(140,100,50,0.3); border-radius: 20px; transition: all 0.2s; }
  .nav a:hover { background: rgba(180,140,60,0.15); color: #6b3d1e; }
  .main { display: grid; grid-template-columns: 1fr 1fr; max-width: 1000px; margin: 0 auto; min-height: calc(100vh - 140px); }
  .left-panel { padding: 30px 25px; border-right: 1px solid rgba(140,100,50,0.25); }
  .right-panel { padding: 30px 25px; background: rgba(255,252,245,0.5); }
  .panel-title { font-size: 0.75em; letter-spacing: 0.3em; color: #9a7a5a; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid rgba(140,100,50,0.2); }
  .sentence { display: inline; cursor: pointer; line-height: 2.4; font-size: 1em; letter-spacing: 0.05em; transition: background 0.2s; border-radius: 3px; padding: 1px 2px; }
  .sentence:hover { background: rgba(180,140,60,0.15); }
  .sentence.active { background: rgba(180,140,60,0.28); color: #6b3d1e; font-weight: 700; }
  .translation-box { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .original-ref { font-size: 0.75em; color: #9a7a5a; margin-bottom: 12px; letter-spacing: 0.08em; padding: 6px 10px; background: rgba(180,140,60,0.1); border-left: 3px solid #c8a050; border-radius: 0 4px 4px 0; }
  .translation-text { font-size: 0.95em; line-height: 2.2; color: #3d2410; letter-spacing: 0.05em; }

<body>
<div class="header">
  <h1>金剛般若波羅蜜經</h1>
  <p>第十品　莊嚴淨土分　｜　點擊原文句子，右側顯示白話翻譯</p>
</div>
<div class="nav">
  <a href="Diamond Sutra9.html">← 第九品</a>
  <a href="#">第十品（目前）</a>
  <a href="Diamond Sutra11.html">第十一品 →</a>
</div>
<div class="main">
  <div class="left-panel">
    <div class="panel-title">原　文（鳩摩羅什譯）</div>
    <div id="originalText"></div>
  </div>
  <div class="right-panel">
    <div class="panel-title">白話翻譯</div>
    <div id="translationArea">
      <p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>
    </div>
  </div>
</div>
<script>
const verses = [
  {
    original: "佛告須菩提：「於意云何？如來昔在然燈佛所，於法有所得不？」「不也，世尊！如來在然燈佛所，於法實無所得。」",
    translation: "佛告訴須菩提：「你認為如何？如來過去在然燈佛那裡修行的時候，有沒有得到什麼法？」須菩提回答：「沒有，世尊！如來在然燈佛那裡，在法上實際上沒有得到任何東西。」（真正的悟道是無所得，不是得到一個什麼東西。）"
  },
  {
    original: "「須菩提！於意云何？菩薩莊嚴佛土不？」「不也，世尊！何以故？莊嚴佛土者，即非莊嚴，是名莊嚴。」",
    translation: "「須菩提！你認為如何？菩薩有莊嚴（裝飾、建設）佛土（淨土）嗎？」「沒有，世尊！為什麼呢？所謂莊嚴佛土，其實並不是執著地去莊嚴，只是名為莊嚴。」（真正的莊嚴是不執著莊嚴。）"
  },
  {
    original: "「是故須菩提！諸菩薩摩訶薩應如是生清淨心，不應住色生心，不應住聲香味觸法生心，應無所住而生其心。",
    translation: "「所以，須菩提！所有菩薩摩訶薩應當這樣生起清淨心：不應執著於色（形相）而生心，不應執著於聲、香、味、觸、法而生心，應當在無所執著的狀態下生起心念。（此即著名的『應無所住而生其心』，六祖惠能大師聽此句而開悟。）"
  },
  {
    original: "須菩提！譬如有人，身如須彌山王，於意云何？是身為大不？」須菩提言：「甚大，世尊！何以故？佛說非身，是名大身。」",
    translation: "須菩提！譬如有人，身體像須彌山（宇宙中最高大的山）那樣巨大，你認為如何？這個身體算大嗎？」須菩提說：「非常大，世尊！為什麼呢？因為佛說那不是真實固定的身，只是名為大身。」（真正的大，超越了形體的大小。）"
  }
];

function renderOriginal() {
  const container = document.getElementById('originalText');
  verses.forEach((v, i) => {
    const span = document.createElement('span');
    span.className = 'sentence';
    span.textContent = v.original;
    span.addEventListener('click', (e) => { e.stopPropagation(); selectVerse(i); });
    container.appendChild(span);
  });
}

function selectVerse(index) {
  document.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sentence')[index].classList.add('active');
  const area = document.getElementById('translationArea');
  area.innerHTML = `
    <div class="translation-box">
      <div class="original-ref">原文：${verses[index].original}</div>
      <div class="divider">✦</div>
      <div class="translation-text">${verses[index].translation}</div>
    </div>
  `;
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('sentence') && !e.target.closest('#translationArea')) {
    document.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
    document.getElementById('translationArea').innerHTML = '<p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>';
  }
});

renderOriginal();
</script>
