nslateY(0)}}.original-ref{font-size:.75em;color:#9a7a5a;margin-bottom:12px;letter-spacing:.08em;padding:6px 10px;background:rgba(180,140,60,0.1);border-left:3px solid #c8a050;border-radius:0 4px 4px 0}.translation-text{font-size:.95em;line-height:2.2;color:#3d2410;letter-spacing:.05em}.hint{color:#b8956a;font-size:.85em;line-height:2.2;letter-spacing:.08em;font-style:italic}.divider{text-align:center;color:rgba(140,100,50,0.4);margin:12px 0;letter-spacing:.5em}.counter{text-align:center;padding:12px;background:rgba(255,248,235,0.9);border-top:1px solid rgba(140,100,50,0.15);font-size:.8em;color:#9a7a5a;letter-spacing:.15em}.counter span{color:#6b3d1e;font-weight:bold;font-size:1.1em}.ending{text-align:center;padding:20px;background:rgba(180,140,60,0.08);border-top:1px solid rgba(140,100,50,0.2);color:#9a7a5a;font-size:.85em;letter-spacing:.2em}@media(max-width:600px){.main{grid-template-columns:1fr}.left-panel{border-right:none;border-bottom:1px solid rgba(140,100,50,0.25)}.nav{gap:10px}}</style></head>

<div class="main">
<div class="left-panel"><div class="panel-title">原　文（鳩摩羅什譯）</div><div id="originalText"></div></div>

<div class="ending">🙏 金剛般若波羅蜜經　全經圓滿 🙏</div>
<script>
const verses=[
{original:"「須菩提！若有人以滿無量阿僧祇世界七寶，持用布施；若有善男子、善女人，發菩提心者，持於此經，乃至四句偈等，受持讀誦，為人演說，其福勝彼。",translation:"「須菩提！如果有人以充滿無量無數世界的七寶來布施；如果另有善男子、善女人，發了菩提心，受持這部經，哪怕只是其中四句偈，讀誦並為人演說，他所得的福德超過了前者。"},
{original:"云何為人演說？不取於相，如如不動。",translation:"怎樣為人演說呢？不執取任何相，保持如如不動的本然狀態。"},
{original:"何以故？一切有為法，如夢幻泡影，如露亦如電，應作如是觀。」",translation:"為什麼呢？一切有為的現象，就像夢境、幻覺、水泡、影子，又像露水，又像閃電，應當這樣去觀照它們。」"},
{original:"佛說是經已，長老須菩提及諸比丘、比丘尼、優婆塞、優婆夷，一切世間、天、人、阿修羅，聞佛所說，皆大歡喜，信受奉行。",translation:"佛說完這部經後，長老須菩提以及眾比丘、比丘尼、優婆塞、優婆夷，一切世間的天神、人類、阿修羅，聽了佛所說的，都非常歡喜，信受奉行。"}
];
const KEY='visits_sutra32';let count=parseInt(localStorage.getItem(KEY)||'0')+1;localStorage.setItem(KEY,count);document.getElementById('visitCount').textContent=count;
function renderOriginal(){const c=document.getElementById('originalText');verses.forEach((v,i)=>{const s=document.createElement('span');s.className='sentence';s.textContent=v.original;s.addEventListener('click',()=>selectVerse(i));c.appendChild(s);})}
function selectVerse(i){document.querySelectorAll('.sentence').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.sentence')[i].classList.add('active');document.getElementById('translationArea').innerHTML='<div class="translation-box"><div class="original-ref">原文：'+verses[i].original+'</div><div class="divider">✦</div><div class="translation-text">'+verses[i].translation+'</div></div>';}
document.addEventListener('click',e=>{if(!e.target.classList.contains('sentence')&&!e.target.closest('#translationArea')){document.querySelectorAll('.sentence').forEach(s=>s.classList.remove('active'));document.getElementById('translationArea').innerHTML='<p class="hint">請點擊左側原文中的任何一句，此處即顯示對應的白話解釋。</p>';}});
renderOriginal();
</script></body></html>
